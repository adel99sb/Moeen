<!DOCTYPE html>
<html lang="en">
<head>
    <!-- رابط مكتبة أيقونات بوتستراب -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Moeen.App</title>
    <base href="/" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="Moeen.App.styles.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            background: #f7f4ee;
        }

        .app-boot-shell {
            min-height: 100vh;
            width: 100%;
            background:
                radial-gradient(circle at top, rgba(25, 80, 66, 0.10), transparent 34%),
                linear-gradient(180deg, #f7f4ee 0%, #ffffff 100%);
        }
    </style>
</head>

<body>

    <div class="status-bar-safe-area"></div>

    <div id="app">
        <div class="app-boot-shell" aria-label="جاري تحميل معين"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>

</body>

</html>
